name: CPU verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Historical v3/v4 verification reads both pinned release trees.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python repro.py --help
      - run: python tools/verify_package.py
      - run: python tools/review_calibration.py --check
      - run: python tools/review_packet_study.py
      - run: python tools/verify_packet_briefing.py
      - run: python tools/verify_repository_guide.py
      - run: python tools/build_course.py --check
      - run: python tools/verify_course_video.py
      - run: python tools/verify_video_course_v3.py
      - run: python tools/verify_video_course_v4.py
      - run: python tools/build_video_page.py --check
      - run: python tools/check_client_export.py
