name: Publish measured replay
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/verify_package.py
      - name: Stage the public site without the retired interactive course
        run: |
          mkdir -p runs/pages-site
          cp -a docs/customer/demo/. runs/pages-site/
          rm -rf runs/pages-site/course
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: runs/pages-site
      - name: Deploy measured replay
        id: deployment
        uses: actions/deploy-pages@v4
